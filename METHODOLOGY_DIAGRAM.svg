<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Methodology: sensing-aided UAV beam prediction</title>
  <desc id="desc">DeepSense 6G Scenario 23 data is aligned and sequence-grouped, then used in separate current-beam and next-beam prediction tasks. Results are evaluated against persistence with accuracy and power-regret measures. A Sionna ray-tracing pilot is shown separately as simulation-only.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf2f8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#14233b" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#52657f"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#168a87"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17263b}
      .title{font-size:42px;font-weight:700}.subtitle{font-size:21px;fill:#50627a}
      .stage{font-size:23px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:16px;fill:#50627a}.label{font-size:16px;font-weight:700}
      .card{fill:#fff;stroke:#d5deea;stroke-width:2;rx:18;filter:url(#shadow)}
      .subcard{fill:#f8fafc;stroke:#dce4ee;stroke-width:1.5;rx:14}
      .arrow{fill:none;stroke:#52657f;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="70" y="76" class="title">Sensing-Aided UAV Beam Prediction</text>
  <text x="70" y="116" class="subtitle">Real-data methodology on DeepSense 6G Scenario 23 · Current-beam and next-beam tasks evaluated separately</text>

  <!-- 1. Dataset -->
  <rect x="60" y="165" width="330" height="505" class="card"/>
  <rect x="60" y="165" width="330" height="62" rx="18" fill="#d9ecff"/>
  <text x="84" y="204" class="stage">1 · Real-world data</text>
  <text x="84" y="266" class="head">Scenario 23</text>
  <text x="84" y="298" class="body">11,387 synchronized samples</text>
  <text x="84" y="326" class="body">35 flight sequences</text>
  <rect x="82" y="354" width="286" height="77" class="subcard"/>
  <circle cx="111" cy="391" r="16" fill="#4e8fc7"/><circle cx="111" cy="391" r="7" fill="#fff"/>
  <text x="141" y="385" class="label">Camera</text><text x="141" y="411" class="small">RGB image per observation</text>
  <rect x="82" y="444" width="286" height="87" class="subcard"/>
  <path d="M98 470h28M112 456v28M100 458l24 24M124 458l-24 24" stroke="#168a87" stroke-width="3"/>
  <text x="141" y="475" class="label">UAV sensors</text><text x="141" y="502" class="small">11 position and motion features</text>
  <rect x="82" y="544" width="286" height="87" class="subcard"/>
  <g fill="#f0a83b"><rect x="99" y="574" width="8" height="29" rx="3"/><rect x="112" y="560" width="8" height="43" rx="3"/><rect x="125" y="568" width="8" height="35" rx="3"/></g>
  <text x="151" y="576" class="label">Beam measurements</text><text x="151" y="603" class="small">64 received-power values</text>

  <!-- 2. Preparation -->
  <rect x="420" y="165" width="365" height="505" class="card"/>
  <rect x="420" y="165" width="365" height="62" rx="18" fill="#e7e2ff"/>
  <text x="444" y="204" class="stage">2 · Prepare &amp; split</text>
  <rect x="445" y="254" width="315" height="81" class="subcard"/>
  <text x="464" y="285" class="label">Synchronize modalities</text>
  <text x="464" y="312" class="small">Image · sensors · beam powers</text>
  <path d="M602 339v25" class="arrow"/>
  <rect x="445" y="369" width="315" height="88" class="subcard"/>
  <text x="464" y="401" class="label">Create 64-class target</text>
  <text x="464" y="430" class="small">Index of maximum measured power</text>
  <path d="M602 461v25" class="arrow"/>
  <rect x="445" y="491" width="315" height="71" class="subcard"/>
  <text x="464" y="521" class="label">Scale sensors on training data</text>
  <text x="464" y="545" class="small">No validation/test fit</text>
  <path d="M602 566v24" class="arrow"/>
  <rect x="445" y="594" width="315" height="54" rx="12" fill="#fff5df" stroke="#f0d28e" stroke-width="1.5"/>
  <text x="464" y="628" class="label">Keep whole flight sequences together</text>

  <!-- 3. Two tasks -->
  <rect x="815" y="165" width="620" height="505" class="card"/>
  <rect x="815" y="165" width="620" height="62" rx="18" fill="#f6e4f5"/>
  <text x="839" y="204" class="stage">3 · Train two separate predictors</text>
  <rect x="840" y="245" width="570" height="184" rx="16" fill="#f3f9ff" stroke="#bcd9f1" stroke-width="2"/>
  <rect x="840" y="245" width="570" height="42" rx="16" fill="#d9ecff"/>
  <text x="860" y="274" class="head">A. Current beam at time t</text>
  <rect x="860" y="305" width="145" height="88" class="subcard"/>
  <text x="878" y="339" class="label">Image +</text><text x="878" y="365" class="small">11 sensors</text>
  <path d="M1008 349h34" class="arrow"/>
  <rect x="1050" y="305" width="177" height="88" class="subcard"/>
  <text x="1067" y="339" class="label">Fine-tuned ResNet-18</text><text x="1067" y="365" class="small">Learned sensor gate</text>
  <path d="M1230 349h32" class="arrow"/>
  <rect x="1268" y="305" width="122" height="88" rx="14" fill="#e6f5ef" stroke="#b8dfce" stroke-width="1.5"/>
  <text x="1284" y="339" class="label">Beam</text><text x="1284" y="365" class="small">at t</text>

  <rect x="840" y="449" width="570" height="194" rx="16" fill="#f7f4ff" stroke="#d4c8f2" stroke-width="2"/>
  <rect x="840" y="449" width="570" height="42" rx="16" fill="#e7e2ff"/>
  <text x="860" y="478" class="head">B. Next beam at time t+1</text>
  <rect x="860" y="510" width="145" height="91" class="subcard"/>
  <text x="878" y="544" class="label">History</text><text x="878" y="571" class="small">8 observations</text>
  <path d="M1008 555h34" class="arrow"/>
  <rect x="1050" y="510" width="177" height="91" class="subcard"/>
  <text x="1067" y="544" class="label">Temporal multimodal</text><text x="1067" y="571" class="small">Power-aware / Top-1 loss</text>
  <path d="M1230 555h32" class="arrow"/>
  <rect x="1268" y="510" width="122" height="91" rx="14" fill="#e6f5ef" stroke="#b8dfce" stroke-width="1.5"/>
  <text x="1284" y="544" class="label">Beam</text><text x="1284" y="571" class="small">at t+1</text>
  <text x="861" y="625" class="small">Do not merge these tasks' scores: their targets and horizons differ.</text>

  <!-- 4. Evaluation -->
  <rect x="1465" y="165" width="395" height="505" class="card"/>
  <rect x="1465" y="165" width="395" height="62" rx="18" fill="#dff3e8"/>
  <text x="1489" y="204" class="stage">4 · Evaluate</text>
  <text x="1490" y="268" class="head">Reference and metrics</text>
  <rect x="1490" y="286" width="345" height="78" class="subcard"/>
  <text x="1510" y="317" class="label">Compare with persistence</text>
  <text x="1510" y="344" class="small">Keep the previous beam</text>
  <rect x="1490" y="379" width="164" height="94" class="subcard"/>
  <text x="1510" y="411" class="label">Classification</text>
  <text x="1510" y="440" class="small">Top-1 / Top-3 / Top-5</text>
  <rect x="1670" y="379" width="165" height="94" class="subcard"/>
  <text x="1690" y="411" class="label">Link quality</text>
  <text x="1690" y="440" class="small">Power regret (dB)</text>
  <rect x="1490" y="488" width="345" height="72" class="subcard"/>
  <text x="1510" y="519" class="label">Sequence-grouped evaluation</text>
  <text x="1510" y="545" class="small">5-fold OOF; report fold variation</text>
  <rect x="1490" y="575" width="345" height="71" rx="14" fill="#fff5df" stroke="#f0d28e" stroke-width="1.5"/>
  <text x="1510" y="606" class="label">Future Top-5 scan</text>
  <text x="1510" y="632" class="small">5 probes vs 64-beam sweep</text>

  <!-- Main flow arrows -->
  <path d="M392 416h24" class="arrow"/>
  <path d="M787 416h24" class="arrow"/>
  <path d="M1437 416h24" class="arrow"/>

  <!-- Separate simulation lane -->
  <rect x="60" y="716" width="1800" height="300" rx="20" fill="#fff" stroke="#168a87" stroke-width="2.5" stroke-dasharray="12 9" filter="url(#shadow)"/>
  <rect x="60" y="716" width="1800" height="58" rx="20" fill="#dff4f1"/>
  <text x="86" y="754" class="stage">Separate simulation pilot · Sionna RT (not part of real-data model evaluation)</text>
  <rect x="95" y="808" width="435" height="132" class="subcard"/>
  <text x="120" y="847" class="head">Ray-tracing scene</text>
  <text x="120" y="880" class="body">Munich scene with assumed</text><text x="120" y="907" class="body">positions and propagation setup</text>
  <path d="M540 874h68" fill="none" stroke="#168a87" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <rect x="620" y="808" width="435" height="132" class="subcard"/>
  <text x="645" y="847" class="head">Pattern-based ranking</text>
  <text x="645" y="880" class="body">User-provided angular pattern</text><text x="645" y="907" class="body">table; angle mapping uncertain</text>
  <path d="M1065 874h68" fill="none" stroke="#168a87" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <rect x="1145" y="808" width="335" height="132" class="subcard"/>
  <text x="1170" y="847" class="head">Synthetic beam ranks</text>
  <text x="1170" y="880" class="body">Sensitivity study only</text><text x="1170" y="907" class="body">No Scenario 23 accuracy claim</text>
  <rect x="1510" y="800" width="315" height="150" rx="15" fill="#fff2f0" stroke="#e6b0a8" stroke-width="1.5"/>
  <text x="1534" y="837" class="label" fill="#9b3c31">Kept separate</text>
  <text x="1534" y="868" class="small">No simulated samples in training.</text>
  <text x="1534" y="894" class="small">Pattern bundle provenance is unresolved.</text>
  <text x="1534" y="920" class="small">Not calibrated to Scenario 23 geometry.</text>
  <text x="86" y="985" class="small">Real-data headline: modest current-beam Top-1 gain; persistence remains stronger for next-beam Top-1; Top-5 scanning reduces measured power regret.</text>
</svg>
